id: "01"
title: "Services invoice with SSCL and VAT, simple figures"
date: 2026-09-15
document: sale_invoice
answers:
  registered_vat: yes
  sscl_registered: yes
  sscl_activity: services
  wht_agent: no
  wht_deducted_by_customers: no
lines:
  - description: Consulting
    amount: "100000.00"
    amount_type: exclusive
    codes: [SSCL-SVC, VAT-STD]
working: |
  SSCL base = 100000.00 x 1 = 100000.00; SSCL = 100000.00 x 2.5% = 2500.00 (borne by the business, not added to the invoice)
  VAT base = 100000.00 (SSCL does not form part of the VAT base); VAT = 100000.00 x 18% = 18000.00
  Total owed by customer = 100000.00 + 18000.00 = 118000.00
expected:
  lines:
    - net: "100000.00"
      taxes: {SSCL-SVC: "2500.00", VAT-STD: "18000.00"}
  total: "118000.00"
  postings:
    - {account: trade_receivables, debit: "118000.00"}
    - {account: revenue, credit: "100000.00"}
    - {account: output_tax_control, credit: "18000.00"}
    - {account: sscl_expense, debit: "2500.00"}
    - {account: sscl_payable, credit: "2500.00"}
  boxes:
    VAT-RETURN: {"1": "100000.00", "4": "18000.00"}
    SSCL-RETURN: {"1": "100000.00", "2": "2500.00"}
