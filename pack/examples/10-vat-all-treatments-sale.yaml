id: "10"
title: "Sale invoice with standard, zero-rated, exempt and out-of-scope lines"
date: 2026-09-10
document: sale_invoice
answers:
  registered_vat: yes
  sscl_registered: no
  sscl_activity: services
  wht_agent: no
  wht_deducted_by_customers: no
lines:
  - description: Taxable goods
    amount: "40000.00"
    amount_type: exclusive
    codes: [VAT-STD]
  - description: Export goods
    amount: "25000.00"
    amount_type: exclusive
    codes: [VAT-ZERO]
  - description: Exempt supply
    amount: "10000.00"
    amount_type: exclusive
    codes: [VAT-EXEMPT]
  - description: Outside scope
    amount: "5000.00"
    amount_type: exclusive
    codes: [VAT-OOS]
working: |
  Line 1: VAT = 40000.00 x 18% = 7200.00
  Lines 2 to 4: zero-rated, exempt and out-of-scope carry no tax
  Net = 40000.00 + 25000.00 + 10000.00 + 5000.00 = 80000.00; total owed = 80000.00 + 7200.00 = 87200.00
  Out-of-scope is not reported on the VAT return summary
expected:
