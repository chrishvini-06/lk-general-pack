    - net: "40000.00"
      taxes: {VAT-STD: "7200.00"}
    - net: "25000.00"
      taxes: {VAT-ZERO: "0.00"}
    - net: "10000.00"
      taxes: {VAT-EXEMPT: "0.00"}
    - net: "5000.00"
      taxes: {VAT-OOS: "0.00"}
  total: "87200.00"
  postings:
    - {account: trade_receivables, debit: "87200.00"}
    - {account: revenue, credit: "80000.00"}
    - {account: output_tax_control, credit: "7200.00"}
  boxes:
    VAT-RETURN: {"1": "40000.00", "2": "25000.00", "3": "10000.00", "4": "7200.00"}
