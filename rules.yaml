questions:
  - key: registered_vat
    text: Is the business registered for VAT?
    type: yes_no
  - key: sscl_registered
    text: Is the business registered for the Social Security Contribution Levy (SSCL)?
    type: yes_no
  - key: sscl_activity
    text: Which activity does most of the business's SSCL-liable turnover come from?
    type: choice
    options: [services, retail_wholesale, manufacturing]
  - key: wht_agent
    text: Does the business deduct withholding tax from payments to suppliers?
    type: yes_no
  - key: wht_deducted_by_customers
    text: Do the business's customers deduct withholding tax when they pay it?
    type: yes_no

accounts:
  - key: output_tax_control
    name: VAT Output Tax Control
    subtype: current_liability
    purpose: VAT charged on sales, awaiting payment to the Inland Revenue Department
    add_when: registered_vat
  - key: input_tax_control
    name: VAT Input Tax Control
    subtype: current_asset
    purpose: Recoverable VAT charged by suppliers, to be set against output tax
    add_when: registered_vat
  - key: sscl_payable
    name: SSCL Payable
    subtype: current_liability
    purpose: Social Security Contribution Levy accrued on liable turnover, awaiting payment
    add_when: sscl_registered
  - key: sscl_expense
    name: SSCL Expense
    subtype: operating_expense
    purpose: Social Security Contribution Levy borne by the business
    add_when: sscl_registered
  - key: wht_payable
    name: Withholding Tax Payable
    subtype: current_liability
    purpose: Tax deducted from supplier payments, awaiting payment to the Inland Revenue Department
    add_when: wht_agent
  - key: wht_receivable
    name: Withholding Tax Receivable
    subtype: current_asset
    purpose: Tax deducted by customers from payments to the business, held as a credit
    add_when: wht_deducted_by_customers

taxes:
  - key: VAT
    name: Value added tax
    kind: output_input
    applies_when: registered_vat
    accounts:
      output: output_tax_control
      input: input_tax_control
    filing:
      frequency: monthly
      due: {day_of_following_month: 20}
    registration_threshold:
      amount: "60000000.00"
      measure: rolling_12_months
      effective_from: 2024-01-01
      source: "Inland Revenue Department, Value Added Tax (VAT) page, Registration Threshold (page last updated 19 Nov 2025); VAT Act No. 14 of 2002 as amended; Value Added Tax (Amendment) Act No. 14 of 2026 (certified 30 Jun 2026) leaves this threshold unchanged"

  - key: SSCL
    name: Social Security Contribution Levy
    kind: levy
    applies_when: sscl_registered
    charged_to_customer: false
    accounts:
      payable: sscl_payable
      expense: sscl_expense
    filing:
      frequency: quarterly
      due: {day_of_following_month: 20}
    registration_threshold:
      amount: "36000000.00"
      measure: rolling_12_months
      effective_from: 2026-07-01
      source: "Social Security Contribution Levy (Amendment) Act No. 10 of 2026 (certified 9 Apr 2026); IRD Notice to Taxpayers PN/SSCL/2026-04/1 dated 16 Apr 2026"

  - key: WHT
    name: Withholding tax on service fees
    kind: withholding
    accounts:
      receivable: wht_receivable
      payable: wht_payable
    filing:
      frequency: monthly
      due: {days_after_period_end: 15}

tax_codes:
  # ---------- VAT ----------
  - key: VAT-STD
    tax: VAT
    name: Standard-rated
    applies_to: [sales, purchases]
    treatment: standard
    input_recoverable: true
    rates:
      - rate: "15"
        effective_from: 2022-09-01
        effective_to: 2023-12-31
        source: "Inland Revenue Department, Value Added Tax (VAT) page, VAT Rates, Standard Rate, 'From 01.09.2022 to 31.12.2023 - 15%' (page last updated 19 Nov 2025)"
      - rate: "18"
        effective_from: 2024-01-01
        effective_to: null
        source: "Inland Revenue Department, Value Added Tax (VAT) page, VAT Rates, Standard Rate, 'From 01.01.2024 - 18%' (page last updated 19 Nov 2025); VAT Act No. 14 of 2002 as amended"
  - key: VAT-ZERO
    tax: VAT
    name: Zero-rated (exports)
    applies_to: [sales]
    treatment: zero_rated
    rates:
      - rate: "0"
        effective_from: 2022-09-01
        effective_to: null
        source: "Inland Revenue Department, Value Added Tax (VAT) page, VAT Rates, Zero Rate (0%), Exports (page last updated 19 Nov 2025)"
  - key: VAT-EXEMPT
    tax: VAT
    name: Exempt supply (VAT Act First Schedule, Part II)
    applies_to: [sales, purchases]
    treatment: exempt
  - key: VAT-OOS
    tax: VAT
    name: Outside the scope of VAT
    applies_to: [sales, purchases]
    treatment: out_of_scope

  # ---------- SSCL (levy on turnover, borne by the business, not added to the invoice) ----------
  - key: SSCL-SVC
    tax: SSCL
    name: SSCL, supply of services (100% of turnover liable)
    applies_to: [sales]
    applies_when: {question: sscl_activity, in: [services]}
    treatment: standard
    rates:
      - rate: "2.5"
        base: {fraction: "1"}
        effective_from: 2022-10-01
        effective_to: null
        source: "Social Security Contribution Levy Act No. 25 of 2022, as amended; Inland Revenue Department, SSCL page, Rate, item 3(c) 'Service other than (a) and (b): 100% of the turnover' (page last updated 27 Jan 2026)"
  - key: SSCL-RW
    tax: SSCL
    name: SSCL, wholesale or retail sale (50% of turnover liable)
    applies_to: [sales]
    applies_when: {question: sscl_activity, in: [retail_wholesale]}
    treatment: standard
    rates:
      - rate: "2.5"
        base: {fraction: "1/2"}
        effective_from: 2022-10-01
        effective_to: null
        source: "Social Security Contribution Levy Act No. 25 of 2022, as amended; Inland Revenue Department, SSCL page, Rate, item 4(b) 'Wholesale or retail sale other than item (a): 50% of the turnover' (page last updated 27 Jan 2026)"
  - key: SSCL-MFG
    tax: SSCL
    name: SSCL, manufacture and sale of articles (85% of turnover liable)
    applies_to: [sales]
    applies_when: {question: sscl_activity, in: [manufacturing]}
    treatment: standard
    rates:
      - rate: "2.5"
        base: {fraction: "17/20"}
        effective_from: 2022-10-01
        effective_to: null
        source: "Social Security Contribution Levy Act No. 25 of 2022, as amended; Inland Revenue Department, SSCL page, Rate, item 2 'Manufacture of any article: 85% of the turnover' (page last updated 27 Jan 2026)"
  - key: SSCL-EXEMPT
    tax: SSCL
    name: SSCL, exempt or excluded turnover (for example articles exported)
    applies_to: [sales]
    treatment: exempt

  # ---------- Withholding tax on service fees ----------
  - key: WHT-SVC
    tax: WHT
    name: Service fees to a resident individual, not an employee
    applies_to: [receipts, payments]
    treatment: withholding
    rates:
      - rate: "5"
        effective_from: 2026-06-03
        effective_to: null
        source: "Inland Revenue Act No. 24 of 2017 as amended by Inland Revenue (Amendment) Act No. 11 of 2026 (certified 3 Jun 2026); IRD Circular SEC/2026/E/04 dated 8 Jun 2026, service fees paid to a resident individual: 5%"
  - key: WHT-NR
    tax: WHT
    name: Service fees paid to a non-resident person
    applies_to: [payments]
    treatment: withholding
    rates:
      - rate: "14"
        effective_from: 2026-06-03
        effective_to: null
        source: "Inland Revenue Act No. 24 of 2017 as amended by Inland Revenue (Amendment) Act No. 11 of 2026 (certified 3 Jun 2026); IRD Circular SEC/2026/E/04 dated 8 Jun 2026, service fees or insurance premiums paid to a non-resident person: 14%"

rounding:
  level: line
  method: half_up
  decimals: 2

returns:
  - key: VAT-RETURN
    tax: VAT
    name: VAT return summary
    boxes:
      - key: "1"
        label: Standard-rated sales (value before tax)
        sum:
          - {code: VAT-STD, side: sales, measure: net}
      - key: "2"
        label: Zero-rated sales (value)
        sum:
          - {code: VAT-ZERO, side: sales, measure: net}
      - key: "3"
        label: Exempt sales (value)
        sum:
          - {code: VAT-EXEMPT, side: sales, measure: net}
      - key: "4"
        label: Output tax
        sum:
          - {code: VAT-STD, side: sales, measure: output_tax}
      - key: "5"
        label: Standard-rated purchases (value before tax)
        sum:
          - {code: VAT-STD, side: purchases, measure: net}
      - key: "6"
        label: Input tax
        sum:
          - {code: VAT-STD, side: purchases, measure: input_tax}
      - key: "7"
        label: Exempt purchases (value)
        sum:
          - {code: VAT-EXEMPT, side: purchases, measure: net}

  - key: SSCL-RETURN
    tax: SSCL
    name: SSCL return summary
    boxes:
      - key: "1"
        label: Turnover before applying the liable percentage
        sum:
          - {code: SSCL-SVC, side: sales, measure: net}
          - {code: SSCL-RW, side: sales, measure: net}
          - {code: SSCL-MFG, side: sales, measure: net}
      - key: "2"
        label: SSCL for the period
        sum:
          - {code: SSCL-SVC, side: sales, measure: tax}
          - {code: SSCL-RW, side: sales, measure: tax}
          - {code: SSCL-MFG, side: sales, measure: tax}
      - key: "3"
        label: Exempt or excluded turnover
        sum:
          - {code: SSCL-EXEMPT, side: sales, measure: net}

  - key: WHT-RETURN
    tax: WHT
    name: Withholding tax summary
    boxes:
      - key: "1"
        label: Service fees paid to resident individuals (amount settled)
        sum:
          - {code: WHT-SVC, side: payments, measure: net}
      - key: "2"
        label: Tax withheld from resident individuals
        sum:
          - {code: WHT-SVC, side: payments, measure: withheld}
      - key: "3"
        label: Service fees paid to non-residents (amount settled)
        sum:
          - {code: WHT-NR, side: payments, measure: net}
      - key: "4"
        label: Tax withheld from non-residents
        sum:
          - {code: WHT-NR, side: payments, measure: withheld}
      - key: "5"
        label: Tax withheld by customers from receipts
        sum:
          - {code: WHT-SVC, side: receipts, measure: withheld}

pending_changes: []
